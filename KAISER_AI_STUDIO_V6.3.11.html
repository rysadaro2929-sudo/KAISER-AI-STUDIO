<style>

<script>
/* KAISOR AI Smart Clip - local visual-analysis prototype.
   This is heuristic video analysis, not semantic AI understanding.
   Cloud enhancement is optional and must be provided by a trusted backend. */
(function (global) {
  "use strict";

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  function waitForEvent(target, eventName) {
    return new Promise((resolve, reject) => {
      const onOk = () => { cleanup(); resolve(); };
      const onErr = () => { cleanup(); reject(new Error("មិនអាចអានវីដេអូបានទេ។")); };
      const cleanup = () => {
        target.removeEventListener(eventName, onOk);
        target.removeEventListener("error", onErr);
      };
      target.addEventListener(eventName, onOk, { once: true });
      target.addEventListener("error", onErr, { once: true });
    });
  }

  function seekTo(video, time) {
    return new Promise((resolve, reject) => {
      if (Math.abs(video.currentTime - time) < 0.04) return resolve();
      const done = () => { cleanup(); resolve(); };
      const fail = () => { cleanup(); reject(new Error("ការរំកិលទៅពេលវេលានេះបរាជ័យ។")); };
      const cleanup = () => {
        video.removeEventListener("seeked", done);
        video.removeEventListener("error", fail);
      };
      video.addEventListener("seeked", done, { once: true });
      video.addEventListener("error", fail, { once: true });
      video.currentTime = time;
    });
  }

  function frameSignature(ctx, width, height) {
    const image = ctx.getImageData(0, 0, width, height);
    const data = image.data;
    const bins = new Array(16).fill(0);
    let sum = 0, edge = 0, diff = 0, count = 0;
    const gray = new Uint8Array(width * height);
    for (let p = 0, i = 0; p < data.length; p += 4, i++) {
      const y = Math.round((data[p] * 0.299 + data[p + 1] * 0.587 + data[p + 2] * 0.114));
      gray[i] = y;
      bins[y >> 4]++;
      sum += y;
    }
    for (let y = 1; y < height; y++) {
      for (let x = 1; x < width; x++) {
        const i = y * width + x;
        const d = Math.abs(gray[i] - gray[i - 1]) + Math.abs(gray[i] - gray[i - width]);
        edge += d;
        count++;
      }
    }
    for (let i = 0; i < bins.length; i++) bins[i] /= (width * height);
    return { bins, mean: sum / (width * height), edge: count ? edge / count : 0, gray };
  }

  function signatureDifference(a, b) {
    let hist = 0;
    for (let i = 0; i < a.bins.length; i++) hist += Math.abs(a.bins[i] - b.bins[i]);
    let pixel = 0;
    const step = 7;
    for (let i = 0; i < a.gray.length; i += step) pixel += Math.abs(a.gray[i] - b.gray[i]) / 255;
    pixel /= Math.ceil(a.gray.length / step);
    return clamp(hist * 0.48 + pixel * 0.52, 0, 1);
  }

  async function analyzeVideo(video, options, onProgress) {
    options = options || {};
    const duration = Number(video.duration);
    if (!Number.isFinite(duration) || duration < 1) throw new Error("វីដេអូខ្លីពេក ឬមិនអាចអានរយៈពេលបាន។");

    const sampleEvery = options.sampleEvery || 1.25;
    const maxSamples = options.maxSamples || 240;
    const count = Math.min(maxSamples, Math.max(2, Math.ceil(duration / sampleEvery)));
    const interval = duration / count;
    const width = 96, height = 54;
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const samples = [];
    const oldTime = video.currentTime;
    const wasPaused = video.paused;
    video.pause();

    try {
      for (let i = 0; i < count; i++) {
        const time = Math.min(Math.max(0, i * interval), Math.max(0, duration - 0.08));
        await seekTo(video, time);
        ctx.drawImage(video, 0, 0, width, height);
        const sig = frameSignature(ctx, width, height);
        samples.push({ time, sig, thumbnail: canvas.toDataURL("image/jpeg", 0.48) });
        if (onProgress) onProgress(Math.round(((i + 1) / count) * 85), `កំពុងវិភាគរូបភាព ${i + 1}/${count}`);
        await new Promise(r => setTimeout(r, 0));
      }
    } finally {
      try { await seekTo(video, Math.min(oldTime, Math.max(0, duration - 0.05))); } catch (_) {}
      if (!wasPaused) video.play().catch(() => {});
    }

    const sensitivity = options.sensitivity || "medium";
    const cutThreshold = sensitivity === "high" ? 0.20 : sensitivity === "low" ? 0.34 : 0.26;
    const changes = [];
    for (let i = 1; i < samples.length; i++) {
      changes.push(signatureDifference(samples[i - 1].sig, samples[i].sig));
    }

    const boundaries = [0];
    for (let i = 1; i < samples.length - 1; i++) {
      if (changes[i] >= cutThreshold && samples[i].time - boundaries[boundaries.length - 1] >= 2.0) {
        boundaries.push(samples[i].time);
      }
    }
    boundaries.push(duration);

    let scenes = [];
    for (let i = 0; i < boundaries.length - 1; i++) {
      const start = boundaries[i], end = boundaries[i + 1];
      if (end - start < 1.5) continue;
      const subset = samples.filter(s => s.time >= start && s.time < end);
      if (!subset.length) continue;
      const motions = [];
      for (let j = 1; j < subset.length; j++) {
        const idx = samples.indexOf(subset[j]);
        motions.push(changes[Math.max(0, idx - 1)] || 0);
      }
      const avgMotion = motions.length ? motions.reduce((a,b) => a+b,0)/motions.length : 0;
      const avgEdge = subset.reduce((a,s) => a + s.sig.edge, 0) / subset.length;
      const visualVariety = clamp(avgMotion * 1.8, 0, 1);
      const visualDetail = clamp(avgEdge / 70, 0, 1);
      const lengthFit = clamp(1 - Math.abs((end-start)-8)/18, 0.25, 1);
      const score = Math.round((visualVariety * 0.55 + visualDetail * 0.25 + lengthFit * 0.20) * 100);
      scenes.push({
        id: `local-${i + 1}`,
        start: Math.max(0, start),
        end: Math.min(duration, end),
        score,
        motion: Math.round(visualVariety * 100),
        reason: "ចំណាត់ថ្នាក់តាមចលនា និងភាពខុសគ្នានៃរូបភាព",
        thumbnail: subset[Math.floor(subset.length / 2)].thumbnail,
        source: "local"
      });
    }

    // If there are only a few long scenes, split them into useful short candidates.
    const expanded = [];
    scenes.forEach(scene => {
      const length = scene.end - scene.start;
      if (length > 16) {
        const chunk = 8;
        for (let t = scene.start; t < scene.end; t += chunk) {
          const end = Math.min(scene.end, t + chunk);
          if (end - t >= 3) expanded.push({ ...scene, id: `${scene.id}-${expanded.length+1}`, start: t, end, score: scene.score });
        }
      } else expanded.push(scene);
    });

    expanded.sort((a,b) => b.score - a.score);
    if (onProgress) onProgress(100, "វិភាគ Local រួចរាល់");
    return { duration, scenes: expanded, sampleCount: samples.length, engine: "LOCAL HEURISTIC" };
  }

  function chooseHighlights(scenes, targetSeconds) {
    const sorted = scenes.slice().sort((a,b) => b.score - a.score);
    const chosen = [];
    let total = 0;
    for (const scene of sorted) {
      const length = scene.end - scene.start;
      if (length < 1.5 || total >= targetSeconds) continue;
      const take = Math.min(length, targetSeconds - total);
      if (take < 1.5) continue;
      chosen.push({ ...scene, end: scene.start + take, selected: true });
      total += take;
    }
    chosen.sort((a,b) => a.start - b.start);
    return chosen;
  }

  async function enhanceWithCloud(endpoint, analysis, videoInfo, instruction) {
    if (!endpoint) return null;
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        task: "rank_video_highlights",
        instruction: typeof instruction === "string" ? instruction.slice(0, 2000) : "",
        video: videoInfo,
        candidates: analysis.scenes.map(s => ({
          id: s.id, start: s.start, end: s.end, local_score: s.score,
          thumbnail_jpeg_data_url: s.thumbnail
        }))
      })
    });
    if (!response.ok) throw new Error(`Cloud AI server error: HTTP ${response.status}`);
    const data = await response.json();
    if (!Array.isArray(data.highlights)) throw new Error("Cloud AI response មិនមាន highlights array ទេ។");
    const byId = new Map(analysis.scenes.map(s => [s.id, s]));
    return data.highlights.map((h, i) => {
      const base = byId.get(h.id);
      if (!base) return null;
      return {
        ...base,
        score: Number.isFinite(Number(h.score)) ? clamp(Number(h.score), 0, 100) : base.score,
        reason: typeof h.reason === "string" ? h.reason.slice(0, 180) : "Cloud AI highlight",
        source: "cloud"
      };
    }).filter(Boolean).sort((a,b) => b.score - a.score);
  }

  global.KAISORAI = { analyzeVideo, chooseHighlights, enhanceWithCloud };
})(window);

 for(let i=TX.length-1;i>=0;i--){const t=TX[i];if(g<t.st||g>=t.st+t.d)continue;
  const fs=t.size*W,lines=t.s.split('\n');ctx.save();ctx.font='700 '+fs+'px "'+(t.font||'Noto Sans Khmer')+'","Noto Sans Khmer",system-ui,sans-serif';
  const width=Math.max(...lines.map(v=>ctx.measureText(v).width))+fs*.65,height=lines.length*fs*1.45;ctx.restore();
  const x=t.x*W,y=t.y*H;
  if(px>=x-width/2&&px<=x+width/2&&py>=y-height/2&&py<=y+height/2)return i;
 }
 return -1;
}
function canvasPoint(e){
 const r=cv.getBoundingClientRect();
 return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};
}
const pointerDistance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
cv.addEventListener('pointerdown',e=>{
 if(ex||playing||trackDrag)return;
 const p=canvasPoint(e);textPointers.set(e.pointerId,p);
 if(textPointers.size===1){
  const i=textHit(p.x,p.y);if(i<0){textPointers.delete(e.pointerId);return}
  selT=i;const t=TX[i];
  textDrag={i,dx:p.x-t.x*cv.width,dy:p.y-t.y*cv.height};td=1;moved=false;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  lay();
 }else if(textPointers.size===2&&selT>=0){
  e.preventDefault();e.stopImmediatePropagation();
  const a=[...textPointers.values()],t=TX[selT];
  textPinch={i:selT,d:Math.max(1,pointerDistance(a[0],a[1])),
   size:t.size,x:t.x,y:t.y,mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}};
  textDrag=null;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
 }
},true);
cv.addEventListener('pointermove',e=>{
 if(!textPointers.has(e.pointerId))return;
 const p=canvasPoint(e);textPointers.set(e.pointerId,p);
 if(textPinch&&textPointers.size>=2){
  e.preventDefault();e.stopImmediatePropagation();
  const a=[...textPointers.values()],t=TX[textPinch.i];
  if(!t)return;
  const d=Math.max(1,pointerDistance(a[0],a[1]));
  const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  t.size=cl(textPinch.size*d/textPinch.d,.015,.35);
  t.x=cl(textPinch.x+(mid.x-textPinch.mid.x)/cv.width,0,1);
  t.y=cl(textPinch.y+(mid.y-textPinch.mid.y)/cv.height,0,1);
  moved=true;return;
 }
 if(textDrag&&textPointers.size===1){
  const t=TX[textDrag.i];if(!t)return;
  t.x=cl((p.x-textDrag.dx)/cv.width,0,1);
  t.y=cl((p.y-textDrag.dy)/cv.height,0,1);moved=true;
 }
},true);
function finishTextPointer(e){

 }
}

<script>

   Only sampled frame thumbnails and timestamps are sent; never the full video. */
(function(){
 'use strict';
 const oldAI=T.ai;
 const lang=()=>localStorage.getItem('kaisor-language')==='en'?'en':'km';

 const clock=n=>{n=Math.max(0,Number(n)||0);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')};
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 function rangeList(input,scenes,duration){
  if(!Array.isArray(input))return [];

   const base=scenes.find(s=>a>=s.start-.1&&b<=s.end+.1)||scenes.find(s=>a<s.end&&b>s.start);
   return {start:a,end:b,reason:typeof x.reason==='string'?x.reason.slice(0,220):(base?.reason||'')};
  }).filter(Boolean).sort((a,b)=>a.start-b.start);
 }
 function localPlan(scenes,duration){
  const ordered=[...scenes].sort((a,b)=>a.score-b.score), count=Math.max(1,Math.ceil(ordered.length*.25));
  const remove=ordered.slice(0,count).filter(x=>x.score<38).map(x=>({start:x.start,end:x.end,reason:tr('ពិន្ទុរូបភាព/ចលនាទាប — សូមពិនិត្យមុនកាត់','Low visual/motion score — review before cutting')}));
  const keep=[...scenes].sort((a,b)=>b.score-a.score).slice(0,Math.max(1,Math.ceil(scenes.length*.5))).map(x=>({start:x.start,end:x.end,reason:tr('ឈុតមានពិន្ទុរូបភាព/ចលនាខ្ពស់','Higher visual/motion score')}));
  const hook=[...scenes].sort((a,b)=>b.score-a.score)[0];
  return {remove,keep,hook:hook?{start:hook.start,end:Math.min(hook.end,hook.start+Math.min(8,hook.end-hook.start)),reason:tr('ឈុតមានពិន្ទុខ្ពស់បំផុតក្នុងការវិភាគមូលដ្ឋាន','Highest-scoring local segment')}:null,mode:'LOCAL HEURISTIC'};

   const models={image:[['black-forest-labs/flux.1-schnell','Flux Schnell'],['google/gemini-3.1-flash-image','Gemini Flash Image'],['openai/gpt-image-1.5','GPT Image 1.5']],video:[['google/veo-3.1-fast','Veo 3.1 Fast'],['bytedance/seedance-2.0-fast','Seedance 2.0 Fast'],['alibaba/wan-2.6','Wan 2.6'],['x-ai/grok-imagine-video','Grok Imagine Video']]};
   function setMode(mode){selected=mode;imageBtn.classList.toggle('active',mode==='image');videoBtn.classList.toggle('active',mode==='video');durationWrap.style.display=mode==='video'?'flex':'none';generate.textContent=mode==='image'?'Generate Image':'Generate Video';model.innerHTML='';models[mode].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;model.appendChild(o)});status.textContent=mode==='image'?'រួចរាល់សម្រាប់បង្កើតរូបភាព។':'រួចរាល់សម្រាប់បង្កើតវីដេអូ។'}
   imageBtn.addEventListener('click',()=>setMode('image'));videoBtn.addEventListener('click',()=>setMode('video'));
   improve.addEventListener('click',()=>{const p=prompt.value.trim();if(!p){status.textContent='សូមសរសេរ Prompt ជាមុនសិន។';return}prompt.value=p+'. High quality, detailed composition, cinematic lighting, clear subject, professional visual quality.';status.textContent='បានរៀបចំ Prompt រួចរាល់។ សូមពិនិត្យមុន Generate។'});
   async function readError(response){let msg='HTTP '+response.status;try{const j=await response.json();msg=j.error?.message||j.message||j.detail||msg}catch(_){}return new Error(msg)}
   connect.addEventListener('click',async()=>{
    const clientId=appKey.value.trim();
    if(!/^pk_[A-Za-z0-9_-]+$/.test(clientId)){status.textContent='សូមបញ្ចូល App Key ដែលចាប់ផ្ដើមដោយ pk_។';appKey.focus();return}
    if(location.protocol==='file:'||!location.origin||location.origin==='null'){status.textContent='OAuth ត្រូវការបើកកម្មវិធីតាម HTTP/HTTPS (ឧ. localhost) មិនអាចប្រើ file:// បានទេ។';return}
    const redirectUri=location.origin+location.pathname;
    try{
     connect.disabled=true;status.textContent='កំពុងរៀបចំការភ្ជាប់ដោយសុវត្ថិភាព...';
     const randomBytes=n=>{const b=new Uint8Array(n);crypto.getRandomValues(b);return b};
     const toB64Url=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
     const verifier=toB64Url(randomBytes(32));
     const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
     const challenge=toB64Url(digest);
     const state=toB64Url(randomBytes(24));
     sessionStorage.setItem('kaiser-polli-pkce-verifier',verifier);
     sessionStorage.setItem('kaiser-polli-oauth-state',state);
     localStorage.setItem('kaiser-pollinations-app-key',clientId);
     const q=new URLSearchParams({response_type:'code',client_id:clientId,redirect_uri:redirectUri,models:'image,video',budget:'5',expiry:'7',state,code_challenge:challenge,code_challenge_method:'S256'});
     location.href='https://enter.pollinations.ai/authorize?'+q.toString();
    }catch(err){status.textContent='មិនអាចចាប់ផ្ដើម OAuth៖ '+err.message;connect.disabled=false}
   });
   disconnect.addEventListener('click',()=>{window.__KAISER_POLLINATIONS_TOKEN__=null;status.textContent='បានផ្ដាច់ Pollinations។ Token ក្នុង memory ត្រូវបានលុប។'});
   async function waitForVideoJob(jobId,token){const url='https://gen.pollinations.ai/v1/jobs/'+encodeURIComponent(jobId);for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,5000));const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw await readError(r);const j=await r.json();if(j.status==='failed')throw new Error(j.error?.message||'Video generation failed');if(j.status==='succeeded'){const result=j.result_url||j.url;if(result){const v=await fetch(result);if(!v.ok)throw new Error('Could not download generated video');return await v.blob()}const rr=await fetch(url+'/result',{headers:{Authorization:'Bearer '+token}});if(!rr.ok)throw await readError(rr);return await rr.blob()}status.textContent='កំពុងបង្កើតវីដេអូ... '+(i+1)*5+'s'}throw new Error('Video generation timed out. សូមព្យាយាមម្ដងទៀត។')}
   generate.addEventListener('click',async()=>{
    const p=prompt.value.trim();await (window.__KAISER_POLLINATIONS_AUTH_READY__||Promise.resolve());const token=window.__KAISER_POLLINATIONS_TOKEN__;if(!p){status.textContent='សូមសរសេរ Prompt ជាមុនសិន។';return}if(!token){status.textContent='សូមចុច Connect Pollinations ហើយអនុញ្ញាត BYOP ជាមុនសិន។';return}
    generate.disabled=true;improve.disabled=true;previewWrap.innerHTML='';if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}
    try{
     const base='https://gen.pollinations.ai/'+(selected==='image'?'image/':'video/')+encodeURIComponent(p);
     const params=new URLSearchParams({model:model.value});if(selected==='video')params.set('duration',duration.value);
     status.textContent=selected==='image'?'កំពុងបង្កើតរូបភាព...':'កំពុងផ្ញើសំណើបង្កើតវីដេអូ...';
     const headers={Authorization:'Bearer '+token};if(selected==='video')headers.Prefer='respond-async';
     const response=await fetch(base+'?'+params.toString(),{method:'GET',headers});if(!response.ok)throw await readError(response);
     let blob;
     if(selected==='video'&&response.status===202){const job=await response.json();if(!job.id)throw new Error('API did not return a job id');blob=await waitForVideoJob(job.id,token)}else blob=await response.blob();
     if(!blob||!blob.size)throw new Error('API returned an empty media file');
     const isImage=selected==='image';if(isImage&&!blob.type.startsWith('image/'))throw new Error('API did not return an image file');if(!isImage&&!blob.type.startsWith('video/'))throw new Error('API did not return an MP4/video file');
     currentUrl=URL.createObjectURL(blob);const media=document.createElement(isImage?'img':'video');media.className='studio-preview';media.src=currentUrl;if(!isImage){media.controls=true;media.playsInline=true}previewWrap.appendChild(media);
     const download=document.createElement('a');download.href=currentUrl;download.download=isImage?'kaiser-ai-image.'+(blob.type.includes('png')?'png':'jpg'):'kaiser-ai-video.mp4';download.className='studio-action';download.textContent='ទាញយក '+(isImage?'រូបភាព':'វីដេអូ');download.style.textAlign='center';download.style.textDecoration='none';previewWrap.appendChild(download);
     status.textContent='បានបង្កើត '+(isImage?'រូបភាព':'វីដេអូ')+' រួចរាល់។ អ្នកអាចមើល និងទាញយកបាន។';
    }catch(err){console.error('KAISER AI Studio:',err);status.textContent='បង្កើតមិនបាន៖ '+(err.message||err)+' · សូមពិនិត្យ API Key, Internet និង Model។'}finally{generate.disabled=false;improve.disabled=false}
   });
   setMode('image');container.appendChild(root);
  });
 };
 addStudioButton();
})();
