<script>
/* KAISOR AI Smart Clip - local visual-analysis prototype.
   This is heuristic video analysis, not semantic AI understanding.
   Cloud enhancement is optional and must be provided by a trusted backend. */
(function (global) {
  "use strict";

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  function waitForEvent(target, eventName) {
    return new Promise((resolve, reject) => {
      const onOk = () => { cleanup(); resolve(); };
      const onErr = () => { cleanup(); reject(new Error("មិនអាចអានវីដេអូបានទេ។")); };
      const cleanup = () => {
        target.removeEventListener(eventName, onOk);
        target.removeEventListener("error", onErr);
      };
      target.addEventListener(eventName, onOk, { once: true });
      target.addEventListener("error", onErr, { once: true });
    });
  }

  function seekTo(video, time) {
    return new Promise((resolve, reject) => {
      if (Math.abs(video.currentTime - time) < 0.04) return resolve();
      const done = () => { cleanup(); resolve(); };
      const fail = () => { cleanup(); reject(new Error("ការរំកិលទៅពេលវេលានេះបរាជ័យ។")); };
      const cleanup = () => {
        video.removeEventListener("seeked", done);
        video.removeEventListener("error", fail);
      };
      video.addEventListener("seeked", done, { once: true });
      video.addEventListener("error", fail, { once: true });
      video.currentTime = time;
    });
  }

  function frameSignature(ctx, width, height) {
    const image = ctx.getImageData(0, 0, width, height);
    const data = image.data;
    const bins = new Array(16).fill(0);
    let sum = 0, edge = 0, diff = 0, count = 0;
    const gray = new Uint8Array(width * height);
    for (let p = 0, i = 0; p < data.length; p += 4, i++) {
      const y = Math.round((data[p] * 0.299 + data[p + 1] * 0.587 + data[p + 2] * 0.114));
      gray[i] = y;
      bins[y >> 4]++;
      sum += y;
    }
    for (let y = 1; y < height; y++) {
      for (let x = 1; x < width; x++) {
        const i = y * width + x;
        const d = Math.abs(gray[i] - gray[i - 1]) + Math.abs(gray[i] - gray[i - width]);
        edge += d;
        count++;
      }
    }
    for (let i = 0; i < bins.length; i++) bins[i] /= (width * height);
    return { bins, mean: sum / (width * height), edge: count ? edge / count : 0, gray };
  }

  function signatureDifference(a, b) {
    let hist = 0;
    for (let i = 0; i < a.bins.length; i++) hist += Math.abs(a.bins[i] - b.bins[i]);
    let pixel = 0;
    const step = 7;
    for (let i = 0; i < a.gray.length; i += step) pixel += Math.abs(a.gray[i] - b.gray[i]) / 255;
    pixel /= Math.ceil(a.gray.length / step);
    return clamp(hist * 0.48 + pixel * 0.52, 0, 1);
  }

  async function analyzeVideo(video, options, onProgress) {
    options = options || {};
    const duration = Number(video.duration);
    if (!Number.isFinite(duration) || duration < 1) throw new Error("វីដេអូខ្លីពេក ឬមិនអាចអានរយៈពេលបាន។");

    const sampleEvery = options.sampleEvery || 1.25;
    const maxSamples = options.maxSamples || 240;
    const count = Math.min(maxSamples, Math.max(2, Math.ceil(duration / sampleEvery)));
    const interval = duration / count;
    const width = 96, height = 54;
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const samples = [];
    const oldTime = video.currentTime;
    const wasPaused = video.paused;
    video.pause();

    try {
      for (let i = 0; i < count; i++) {
        const time = Math.min(Math.max(0, i * interval), Math.max(0, duration - 0.08));
        await seekTo(video, time);
        ctx.drawImage(video, 0, 0, width, height);
        const sig = frameSignature(ctx, width, height);
        samples.push({ time, sig, thumbnail: canvas.toDataURL("image/jpeg", 0.48) });
        if (onProgress) onProgress(Math.round(((i + 1) / count) * 85), `កំពុងវិភាគរូបភាព ${i + 1}/${count}`);
        await new Promise(r => setTimeout(r, 0));
      }
    } finally {
      try { await seekTo(video, Math.min(oldTime, Math.max(0, duration - 0.05))); } catch (_) {}
      if (!wasPaused) video.play().catch(() => {});
    }

    const sensitivity = options.sensitivity || "medium";
    const cutThreshold = sensitivity === "high" ? 0.20 : sensitivity === "low" ? 0.34 : 0.26;
    const changes = [];
    for (let i = 1; i < samples.length; i++) {
      changes.push(signatureDifference(samples[i - 1].sig, samples[i].sig));
    }

    const boundaries = [0];
    for (let i = 1; i < samples.length - 1; i++) {
      if (changes[i] >= cutThreshold && samples[i].time - boundaries[boundaries.length - 1] >= 2.0) {
        boundaries.push(samples[i].time);
      }
    }
    boundaries.push(duration);

    let scenes = [];
    for (let i = 0; i < boundaries.length - 1; i++) {
      const start = boundaries[i], end = boundaries[i + 1];
      if (end - start < 1.5) continue;
      const subset = samples.filter(s => s.time >= start && s.time < end);
      if (!subset.length) continue;
      const motions = [];
      for (let j = 1; j < subset.length; j++) {
        const idx = samples.indexOf(subset[j]);
        motions.push(changes[Math.max(0, idx - 1)] || 0);
      }
      const avgMotion = motions.length ? motions.reduce((a,b) => a+b,0)/motions.length : 0;
      const avgEdge = subset.reduce((a,s) => a + s.sig.edge, 0) / subset.length;
      const visualVariety = clamp(avgMotion * 1.8, 0, 1);
      const visualDetail = clamp(avgEdge / 70, 0, 1);
      const lengthFit = clamp(1 - Math.abs((end-start)-8)/18, 0.25, 1);
      const score = Math.round((visualVariety * 0.55 + visualDetail * 0.25 + lengthFit * 0.20) * 100);
      scenes.push({
        id: `local-${i + 1}`,
        start: Math.max(0, start),
        end: Math.min(duration, end),
        score,
        motion: Math.round(visualVariety * 100),
        reason: "ចំណាត់ថ្នាក់តាមចលនា និងភាពខុសគ្នានៃរូបភាព",
        thumbnail: subset[Math.floor(subset.length / 2)].thumbnail,
        source: "local"
      });
    }

    // If there are only a few long scenes, split them into useful short candidates.
    const expanded = [];
    scenes.forEach(scene => {
      const length = scene.end - scene.start;
      if (length > 16) {
        const chunk = 8;
        for (let t = scene.start; t < scene.end; t += chunk) {
          const end = Math.min(scene.end, t + chunk);
          if (end - t >= 3) expanded.push({ ...scene, id: `${scene.id}-${expanded.length+1}`, start: t, end, score: scene.score });
        }
      } else expanded.push(scene);
    });

    expanded.sort((a,b) => b.score - a.score);
    if (onProgress) onProgress(100, "វិភាគ Local រួចរាល់");
    return { duration, scenes: expanded, sampleCount: samples.length, engine: "LOCAL HEURISTIC" };
  }

  function chooseHighlights(scenes, targetSeconds) {
    const sorted = scenes.slice().sort((a,b) => b.score - a.score);
    const chosen = [];
    let total = 0;
    for (const scene of sorted) {
      const length = scene.end - scene.start;
      if (length < 1.5 || total >= targetSeconds) continue;
      const take = Math.min(length, targetSeconds - total);
      if (take < 1.5) continue;
      chosen.push({ ...scene, end: scene.start + take, selected: true });
      total += take;
    }
    chosen.sort((a,b) => a.start - b.start);
    return chosen;
  }

  async function enhanceWithCloud(endpoint, analysis, videoInfo, instruction) {
    if (!endpoint) return null;
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },

        task: "rank_video_highlights",

        reason: typeof h.reason === "string" ? h.reason.slice(0, 180) : "Cloud AI highlight",
        source: "cloud"
      };
    }).filter(Boolean).sort((a,b) => b.score - a.score);
  }

async function prepareExportAudio(stream){
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtx)throw new Error('Browser មិនគាំទ្រ Web Audio សម្រាប់បញ្ចូលសំឡេងក្នុង Export ទេ');
 ac=ac||new AudioCtx();
 if(ac.state==='suspended')await ac.resume();
 if(ac.state!=='running')throw new Error('មិនអាចបើក Audio Engine បាន');
 /* A fresh destination is required for every export because its tracks are
    stopped during cleanup. Reuse each media element source, never recreate it. */
 adest=ac.createMediaStreamDestination();
 const connected=new Set();
 const mediaStates=new Map();
 try{
  for(const c of C){
   const el=c.el;
   if(!el||connected.has(el))continue;
   connected.add(el);mediaStates.set(el,{muted:el.muted,volume:el.volume});
   let source=el._kaiserAudioSource;
   if(!source){
    source=ac.createMediaElementSource(el);
    el._kaiserAudioSource=source;
    source.connect(ac.destination); // keep normal preview audio audible
   }
   if(el._kaiserExportDestination){
    try{source.disconnect(el._kaiserExportDestination)}catch(_){}
   }
   source.connect(adest);
   el._kaiserExportDestination=adest;
   el.muted=false;
   const clip=C.find(x=>x.el===el);
   if(clip)el.volume=cl(clip.vol??1,0,1);
  }
  const audioTracks=adest.stream.getAudioTracks();
  if(!audioTracks.length)throw new Error('មិនអាចបង្កើត Audio Track សម្រាប់ Export បាន');
  audioTracks.forEach(track=>stream.addTrack(track));
  return {audioTracks:audioTracks.length,mediaStates};
 }catch(err){
  mediaStates.forEach((v,el)=>{try{el.muted=v.muted;el.volume=v.volume}catch(_){}});
  try{adest.stream.getTracks().forEach(track=>track.stop())}catch(_){}
  adest=null;
  throw err;
 }
}

(function(){

#kme .sf-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:21px}
#kme .sf-tabs{display:flex;gap:22px;align-items:center;padding:5px 18px 13px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
#kme .sf-tabs button{white-space:nowrap;color:#9696a5;font-size:15px;padding:5px 0;position:relative}
#kme .sf-tabs button.active{color:#fff;font-weight:700}
#kme .sf-tabs button.active:after{content:"";position:absolute;left:20%;right:20%;bottom:-7px;height:3px;border-radius:4px;background:#8b5cf6}
#kme .sf-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 100px;scrollbar-width:none}
#kme .sf-feature{width:min(100%,calc((100dvh - 230px)*9/16));height:min(68dvh,calc((100vw - 28px)*16/9));min-height:420px;aspect-ratio:9/16;margin:0 auto;border-radius:18px;background:linear-gradient(145deg,#292a3b,#202130);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px 14px;position:relative;overflow:hidden;box-shadow:0 12px 34px #0005}
#kme .sf-feature-inner{max-width:310px}
#kme .sf-feature-actions{position:absolute;left:0;right:0;bottom:22px;max-width:none;width:100%;pointer-events:none}
#kme .sf-feature-actions .sf-actions{pointer-events:auto;text-shadow:0 1px 5px #000;}
#kme .sf-play{width:58px;height:58px;border-radius:50%;background:#fff;color:#171722;display:grid;place-items:center;margin:0 auto 22px;font-size:24px;box-shadow:0 8px 26px #0004}
#kme .sf-feature h2{font-size:21px;line-height:1.5;margin:0 0 8px;color:#fff}
#kme .sf-feature p{font-size:14px;color:#c6c6d2;line-height:1.7;margin:0 0 16px}
#kme .sf-actions{display:flex;justify-content:center;gap:26px;color:#fff}
#kme .sf-actions button{font-size:23px}
#kme .sf-section{font-size:16px;margin:20px 4px 12px;font-weight:700}
#kme .sf-posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#kme .sf-post-card{border-radius:15px;overflow:hidden;background:#222333;min-width:0;text-align:left}
#kme .sf-post-card video{width:100%;aspect-ratio:9/12;object-fit:cover;display:block;background:#171821}
#kme .sf-post-card .sf-post-meta{padding:9px 10px;font-size:12px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kme .sf-nav{position:absolute;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:9px 7px calc(8px + env(safe-area-inset-bottom,0));background:linear-gradient(180deg,#10111900,#101119 25%);}
#kme .sf-nav button{display:flex;flex-direction:column;align-items:center;gap:5px;color:#9293a2;font-size:10px;min-width:0}
#kme .sf-nav .sf-nav-icon{font-size:23px;line-height:28px}
#kme .sf-nav button.active{color:#fff}
#kme .sf-nav button.create .sf-nav-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#8b5cf6,#6934ce);font-size:30px;margin-top:-15px;box-shadow:0 5px 18px #7138db66}
#kme .sf-empty{padding:28px 16px;text-align:center;color:#aaa;background:#202130;border-radius:16px;font-size:13px;line-height:1.8}
#kme .feed{top:116px;bottom:72px;inset-inline:0;background:#08090d}
#kme .feed .post{height:100%;min-height:100%;background:#08090d}
#kme .feed .post video{width:min(100%,calc((100dvh - 188px)*9/16));height:100%;max-height:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#08090d}
#kme .feed .post .cap{bottom:26px;left:14px;right:88px;z-index:1}
#kme .feed .post .side{right:max(10px,calc((100% - min(100%,calc((100dvh - 188px)*9/16)))/2 + 10px));z-index:1}
#kme .sf-feature .sf-feature-inner{z-index:1;text-shadow:0 2px 12px #000}
@media(max-height:700px){#kme .sf-feature{min-height:360px;height:64dvh}}
@media(min-width:600px){#kme .feed .post video{width:min(100%,420px)}}

#kme .feed-nav{position:absolute;bottom:0;left:0;right:0;height:66px;display:flex;align-items:center;justify-content:space-around;background:#101119;z-index:3}
#kme .feed-nav button{color:#ddd;font-size:12px}
@media(min-width:600px){#kme .sf-scroll{max-width:620px;width:100%;margin:0 auto}#kme .sf-feature{min-height:560px}}

 if((u.protocol!=='https:'&&!(u.protocol==='http:'&&local))||u.username||u.password)
  throw new Error(tr('សុវត្ថិភាព៖ ប្រើ HTTPS (ឬ HTTP សម្រាប់ localhost) និងកុំដាក់ username/password ក្នុង URL','Security: use HTTPS (or HTTP on localhost) and do not embed credentials in the URL'));

     all.onclick=()=>{if(!confirm(tr('លុបចន្លោះទាំង ','Remove all ')+plan.remove.length+tr(' នេះ? (អាច ត្រឡប់ក្រោយ មួយៗបាន)',' ranges? (Undo works step by step)')))return;let ok=0;[...plan.remove].sort((a,b)=>b.start-a.start).forEach(x=>{if(removeRange(url,x.start,x.end)==='ok'){ok++;if(x._b){x._b.disabled=true;x._row.classList.add('done')}}});all.disabled=true;say('✂ '+ok+'/'+plan.remove.length)}}

    status.textContent=tr('វិភាគរួចរាល់ · ','Analysis complete · ')+plan.mode+tr(' · សូមពិនិត្យមុនអនុវត្ត',' · Review before applying');fill.style.width='100%'}
   catch(err){status.textContent=tr('វិភាគបរាជ័យ៖ ','Analysis failed: ')+(err.message||err);console.error('KAISER AI Smart:',err)}
